version: '3.8'
services:
  app:
    image: laravelphp/php-fpm
    container_name: laravel-app
    volumes:
      - .:/var/www
    working_dir: /var/www
    depends_on:
      - postgres
  webserver:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: isipanews
      POSTGRES_USER: isipanews_user
      POSTGRES_PASSWORD: CnnwFa6l1cl9HsGZj3Bg8ohcDhGFQRHL
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
 